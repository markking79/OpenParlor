<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenParlor</title>
    <link rel="stylesheet" href="/openparlor/openparlor.css">
</head>

<body>
    <div class="app">

        <!-- LEFT: conversations -->
        <aside class="sidebar sidebar-left" id="sidebarLeft">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <button id="collapseLeftBtn" class="sidebar-collapse-btn" aria-label="Collapse left sidebar" aria-expanded="true" title="Collapse left sidebar">◀</button>
                </div>
            <div class="brand">
                <div class="brand-mark">OP</div>
                <div>
                    <div class="brand-name">OpenParlor</div>
                    <div class="brand-subtitle">AI Characters</div>
                </div>
            </div>

            <div class="new-chat-area">
                <select id="characterSelect" class="character-select" disabled>
                    <option value="">Select a character…</option>
                </select>
                <button id="newChatButton" class="new-chat" disabled>+ New conversation</button>
            </div>

            <div id="modelStatusPanel" class="model-status-panel">
                <div class="model-status-header">
                    <span class="model-status-dot" id="modelStatusDot"></span>
                    <span class="model-status-title">Model</span>
                </div>
                <div class="model-status-body" id="modelStatusBody">
                    <span class="state-loading">Loading…</span>
                </div>
            </div>

            <div class="section-title">Conversations</div>

            <div id="conversationList" class="conversation-list">
                <div class="state-loading">Loading…</div>
            </div>
            </div>
            <div class="sidebar-rail">
                <button id="restoreLeftBtn" class="sidebar-restore-btn" aria-label="Expand left sidebar" aria-expanded="false" title="Expand left sidebar">▶</button>
            </div>
        </aside>


        <!-- CENTER: chat -->
        <main class="chat">

            <header class="chat-header">
                <div>
                    <h1 id="chatTitle">OpenParlor</h1>
                    <div class="chat-subtitle" id="chatSubtitle">Select a conversation to begin</div>
                </div>
                <button id="autoSpeakButton" class="auto-speak-btn" aria-pressed="false" hidden>
                    Auto-speak: Off
                </button>
                <button id="voiceModeButton" class="voice-mode-btn" aria-pressed="false" hidden>
                    Voice: Off
                </button>
                <button id="handsFreeButton" class="handsfree-btn" aria-pressed="false" hidden>
                    Hands-free: Off
                </button>
            </header>

            <div id="participantsBar" class="participants-bar" hidden>
                <span class="participants-label">Participants:</span>
                <div id="participantsList" class="participants-list"></div>
                <select id="addParticipantSelect" class="add-participant-select">
                    <option value="">Add character…</option>
                </select>
                <button id="addParticipantButton" class="add-participant-btn">Add</button>
            </div>

            <section id="messages" class="messages">
                <div class="state-empty">No conversation selected.</div>
            </section>

            <footer class="composer">
                <div class="composer-box">
                    <div class="recorder-controls">
                        <button id="recordButton" class="record-btn" title="Record message" aria-label="Record message">🎤</button>
                        <button id="stopRecordButton" class="stop-record-btn" title="Stop recording" aria-label="Stop recording" hidden>■</button>
                        <button id="cancelRecordButton" class="cancel-record-btn" title="Cancel recording" aria-label="Cancel recording" hidden>✕</button>
                        <button id="transcribeButton" class="transcribe-btn" title="Transcribe recording" aria-label="Transcribe recording" hidden>Transcribe</button>
                        <span id="recordingIndicator" class="recording-indicator" aria-label="Recording" hidden></span>
                    </div>
                    <span id="recorderError" class="recorder-error" role="status" aria-live="polite" hidden></span>
                    <span id="handsFreeStatus" class="handsfree-status" role="status" aria-live="polite" hidden></span>
                    <span id="transcriptionStatus" class="transcription-status" role="status" aria-live="polite" hidden></span>
                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Type a message…"
                        disabled
                    ></textarea>

                    <button id="sendButton" class="send-button" disabled>
                        Send
                    </button>
                </div>
            </footer>

        </main>


        <!-- RIGHT: characters -->
        <aside class="sidebar sidebar-right" id="sidebarRight">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <button id="collapseRightBtn" class="sidebar-collapse-btn" aria-label="Collapse right sidebar" aria-expanded="true" title="Collapse right sidebar">▶</button>
                </div>

            <div class="section-title character-heading">
                Characters
                <button id="newCharacterButton" class="new-character-btn" title="New character">+ New</button>
                <button id="importCharacterButton" class="new-character-btn" title="Import a character card (JSON or PNG)">Import</button>
                <input type="file" id="importCharacterFileInput" accept=".json,.png,application/json,image/png" hidden>
            </div>

            <div id="characterForm" class="character-form" hidden>
                <div class="form-field">
                    <label for="charNameInput">Name *</label>
                    <input type="text" id="charNameInput" maxlength="100" placeholder="Character name" autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="charAvatarInput">Avatar URL</label>
                    <input type="text" id="charAvatarInput" placeholder="/avatars/name.png" autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="charAvatarFileInput">Upload image</label>
                    <input type="file" id="charAvatarFileInput" accept="image/bmp,image/png,image/jpeg,image/webp,image/gif,image/jfif">
                    <div class="form-help">Images up to 5 MB. Uploading replaces the avatar URL.</div>
                </div>
                <div class="form-field">
                    <label for="charVoiceSelect">Voice</label>
                    <select id="charVoiceSelect" class="form-select">
                        <option value="">No voice</option>
                    </select>
                </div>
                <div id="charFormError" class="form-error" hidden></div>
                <div class="form-actions">
                    <button id="charFormSave" class="form-save">Save</button>
                    <button id="charExportButton" class="form-cancel" type="button" hidden title="Download this character as a character card (JSON)">Export card</button>
                    <button id="charFormCancel" class="form-cancel">Cancel</button>
                </div>
            </div>

            <div id="characterList" class="character-list">
                <div class="state-loading">Loading…</div>
            </div>

            <div id="memorySection" class="memory-section" hidden>
                <div class="section-title memory-heading">
                    Memories
                </div>
                <div id="memoryPanel" class="memory-panel"></div>
            </div>
            </div>
            <div class="sidebar-rail">
                <button id="restoreRightBtn" class="sidebar-restore-btn" aria-label="Expand right sidebar" aria-expanded="false" title="Expand right sidebar">◀</button>
            </div>
        </aside>

    </div>

    <script type="module" src="/openparlor/openparlor.js"></script>
</body>
</html>
